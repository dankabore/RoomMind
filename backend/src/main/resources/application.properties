spring.application.name=roommind
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5433/roommind
spring.datasource.username=roommind
spring.datasource.password=roommind

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.cors.allowed-origin=http://localhost:5173

# Errors come back as RFC 9457 problem details, so the reason given to
# ResponseStatusException arrives in the body as "detail". Without this the
# frontend gets a status code and nothing to show the user.
spring.mvc.problemdetails.enabled=true

# HS256 needs a key of at least 32 bytes. The dev default lets the app start
# straight after a clone; set APP_JWT_SECRET to override it anywhere real.
app.jwt.secret=${APP_JWT_SECRET:dev-only-secret-change-me-at-least-32-chars}
app.jwt.expiry-minutes=60
app.jwt.issuer=roommind
